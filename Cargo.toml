[workspace]
members = [
  "src-tauri",
  "apps/aletheia-audio-service",
  "crates/aletheia-audio-ingest",
  "crates/aletheia-core",
  "crates/aletheia-detection",
  "crates/aletheia-output",
  "crates/aletheia-ops",
  "crates/aletheia-stt",
  "crates/aletheia-store",
  "crates/aletheia-vad",
  "crates/aletheia-vmix",
  "crates/aletheia-osc",
  "crates/aletheia-easyworship",
  "crates/aletheia-obs",
  "crates/aletheia-propresenter",
  "crates/aletheia-companion"
]
resolver = "3"

[workspace.package]
authors = ["Aletheia Team"]
edition = "2024"
license = "Proprietary"
rust-version = "1.94"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

# Patch whisper-rs-sys to use bundled bindings (avoids MSVC bindgen issues on Windows)
# and to use c_int for enum types (matching MSVC ABI expected by whisper-rs 0.11.1).
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
