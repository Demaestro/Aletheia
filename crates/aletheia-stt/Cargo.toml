[package]
name = "aletheia-stt"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio capture — cross-platform microphone input
cpal = "0.15"

# Offline Whisper transcription (links against whisper.cpp via cmake)
# No extra feature needed — the crate's default already includes whisper.cpp.
whisper-rs = "0.11"

# Cloud STT fallback — async HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# WAV encoding for sending audio buffers to cloud APIs
hound = "3.5"

# Error propagation
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

