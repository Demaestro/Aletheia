[package]
name = "aletheia-desktop"
version.workspace = true
description = "Local-first desktop shell for Aletheia worship production"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "aletheia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
aletheia-core = { path = "../crates/aletheia-core" }
aletheia-detection = { path = "../crates/aletheia-detection" }
aletheia-ops = { path = "../crates/aletheia-ops" }
aletheia-output = { path = "../crates/aletheia-output" }
aletheia-stt = { path = "../crates/aletheia-stt" }
aletheia-store = { path = "../crates/aletheia-store" }
aletheia-vmix = { path = "../crates/aletheia-vmix" }
aletheia-osc = { path = "../crates/aletheia-osc" }
aletheia-easyworship = { path = "../crates/aletheia-easyworship" }
aletheia-obs = { path = "../crates/aletheia-obs" }
aletheia-propresenter = { path = "../crates/aletheia-propresenter" }
aletheia-companion = { path = "../crates/aletheia-companion" }
base64 = "0.22"
rusqlite = { workspace = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
keyring = "2.3"
ts-rs = "12.0.1"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
tiny_http = "0.12"
